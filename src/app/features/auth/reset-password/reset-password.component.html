<app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

<div class="auth">
  <div class="auth__card">
    <h1>Redefinir senha</h1>

    <ng-container *ngIf="!linkInvalido(); else invalido">
      <p class="auth__subtitle">Escolha uma nova senha para a sua conta.</p>

      <form class="auth__form" (ngSubmit)="onSubmit()">
        <label class="auth__field">
          <input type="password" name="novaSenha" [(ngModel)]="novaSenha" placeholder="Nova senha" required minlength="10" />
        </label>
        <label class="auth__field">
          <input type="password" name="confirmarSenha" [(ngModel)]="confirmarSenha" placeholder="Confirme a nova senha" required minlength="10" />
        </label>

        <p class="auth__error" *ngIf="error()">{{ error() }}</p>

        <app-button type="submit" variant="primary">{{ submitting() ? 'Salvando…' : 'Salvar nova senha' }}</app-button>
      </form>
    </ng-container>

    <ng-template #invalido>
      <p class="auth__subtitle">Este link de redefinição é inválido ou expirou. Solicite um novo.</p>
      <p class="auth__footnote"><a href="/esqueci-senha">Solicitar novo link.</a></p>
    </ng-template>
  </div>
</div>
