<header class="header">
  <div class="header__bar">
    <a class="header__logo" routerLink="/" aria-label="Tribuna — página inicial">
      <span class="header__logo-text">Tribuna<span class="header__logo-dot">.</span></span>
    </a>

    <nav class="header__nav">
      <div class="header__nav-item" *ngFor="let item of navItems(); let i = index">
        <a
          *ngIf="!item.columns?.length; else dropdownTrigger"
          class="header__nav-trigger header__nav-trigger--link"
          [routerLink]="item.href"
          [style.color]="item.accent"
        >
          {{ item.label }}
        </a>

        <ng-template #dropdownTrigger>
          <button
            type="button"
            class="header__nav-trigger"
            (click)="toggleMenu(i, $event)"
            [class.is-open]="openIndex() === i"
            [attr.aria-expanded]="openIndex() === i"
          >
            {{ item.label }}
            <app-icon name="chevron-down" [size]="14"></app-icon>
          </button>

          <div class="header__mega" *ngIf="openIndex() === i && item.columns?.length">
            <div class="header__mega-col" *ngFor="let col of item.columns">
              <h4>{{ col.title }}</h4>
              <a *ngFor="let link of col.items" [href]="link.href">{{ link.label }}</a>
            </div>
          </div>
        </ng-template>
      </div>
    </nav>

    <div class="header__actions">
      <label class="header__search">
        <app-icon name="search" [size]="16" color="var(--color-muted)"></app-icon>
        <input type="search" placeholder="Buscar" aria-label="Buscar no portal" />
      </label>
      <button type="button" class="header__icon-btn" aria-label="Favoritos">
        <app-icon name="bookmark" [size]="18"></app-icon>
      </button>
      <a class="header__login" routerLink="/cadastre-se">
        <app-icon name="user" [size]="16"></app-icon>
        Entrar
      </a>
      <a class="header__contact" routerLink="/contato">Contato</a>
      <button
        type="button"
        class="header__burger"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Abrir menu"
      >
        <app-icon [name]="mobileOpen() ? 'cross' : 'menu'" [size]="20"></app-icon>
      </button>
    </div>
  </div>

  <div class="header__mobile" *ngIf="mobileOpen()">
    <a class="header__mobile-link" routerLink="/cadastre-se" (click)="closeMobileMenu()">Entrar</a>
    <a class="header__mobile-link" routerLink="/contato" (click)="closeMobileMenu()">Contato</a>

    <ng-container *ngFor="let item of navItems()">
      <a
        *ngIf="!item.columns?.length"
        class="header__mobile-link"
        [routerLink]="item.href"
        [style.color]="item.accent"
        (click)="closeMobileMenu()"
      >
        {{ item.label }}
      </a>

      <div class="header__mobile-group" *ngIf="item.columns?.length">
        <span class="header__mobile-group-title">{{ item.label }}</span>
        <ng-container *ngFor="let col of item.columns">
          <a
            *ngFor="let link of col.items"
            class="header__mobile-sublink"
            [href]="link.href"
            (click)="closeMobileMenu()"
          >
            {{ link.label }}
          </a>
        </ng-container>
      </div>
    </ng-container>
  </div>
</header>
